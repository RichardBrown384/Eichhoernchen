name: Build, Test, and Release

on:
  pull_request:         # Run CI on PRs
  push:
    branches:
      - main            # Optional: build on main pushes
    tags:
      - 'v*'            # Build + release on version tags
  workflow_dispatch:    # Manual trigger

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.9'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up compiler (MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-  

      - name: Configure (CMake)
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: |
          cd build
          cmake --build . --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Package build output (Mac)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          cd build
          zip -r ../Eichhoernchen-${{ runner.os }}.zip .

      - name: Package build output (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path * -DestinationPath ../Eichhoernchen-${{ runner.os }}.zip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: build/Testing/**/Test.xml

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Eichhoernchen-${{ runner.os }}
          path: Eichhoernchen-${{ runner.os }}.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/Eichhoernchen-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
